[project]
name = "reel-autopsy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["verdictkit"]

[tool.uv.sources]
verdictkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_autopsy"]

[project.entry-points."verdictkit.claim_types"]
"reel.mechanical.v1" = "reel_autopsy.claim_type:ReelClaimType"
