[project]
name = "quote-autopsy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["verdictkit"]

[tool.uv.sources]
verdictkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quote_autopsy"]

[project.entry-points."verdictkit.claim_types"]
"quote.finance.v1" = "quote_autopsy.claim_type:FinanceClaimType"
"quote.lease.v1" = "quote_autopsy.claim_type:LeaseClaimType"
