name: Refresh integration uv lock

on:
  push:
    branches: [fix/p0-remote-integration]
    paths:
      - "pyproject.toml"
      - "core/**"
      - "apps/**"
      - "examples/**"
      - ".github/workflows/refresh-integration-lock.yml"
  pull_request:
    branches: [dev/m3b-case-lifecycle]
    paths:
      - "pyproject.toml"
      - "core/**"
      - "apps/**"
      - "examples/**"
      - ".github/workflows/refresh-integration-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/p0-remote-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-remote-integration
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Reconcile locked workspace
        run: uv lock
      - name: Commit lock changes only
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- uv.lock
            git commit -m "build: refresh locked workspace member paths"
            git push origin HEAD:fix/p0-remote-integration
          fi
