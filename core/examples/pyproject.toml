[project]
name = "verdictkit-stub-receipt"
version = "0.1.0"
description = "Third-domain reuse proof: receipt-total claim type (core req 10.3)"
requires-python = ">=3.12"
dependencies = ["verdictkit"]

# Register this claim type so both the CLI and examiner worker discover it via
# importlib.metadata without any VK_CLAIM_TYPES env var.
[project.entry-points."verdictkit.claim_types"]
example_receipt = "stub_claimtype.receipt:ReceiptClaimType"

[tool.uv.sources]
verdictkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stub_claimtype"]
