[project]
name = "verdictkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
mcp = ["mcp>=1.2"]

[project.scripts]
verdictkit = "verdictkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdictkit"]
